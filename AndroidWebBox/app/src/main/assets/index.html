<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndroidWebBox Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .button:active {
            transform: scale(0.98);
        }

        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .result.show {
            display: block;
        }

        .loading {
            color: #666;
            text-align: center;
            padding: 20px;
        }

        .success {
            color: #4caf50;
        }

        .error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 AndroidWebBox</h1>

        <!-- 设备信息 -->
        <div class="card">
            <h2>📱 设备信息</h2>
            <button class="button" onclick="getDeviceInfo()">获取设备信息</button>
            <div id="device-result" class="result"></div>
        </div>

        <!-- 相机 -->
        <div class="card">
            <h2>📷 拍照</h2>
            <button class="button" onclick="capturePhoto()">拍照</button>
            <div id="camera-result" class="result"></div>
        </div>

        <!-- 相册 -->
        <div class="card">
            <h2>🖼️ 相册选择</h2>
            <button class="button" onclick="pickSingleImage()">选择单张图片</button>
            <button class="button" onclick="pickMultipleImages()">选择多张图片</button>
            <button class="button" onclick="pickVideo()">选择视频</button>
            <div id="gallery-result" class="result"></div>
        </div>

        <!-- 录像 -->
        <div class="card">
            <h2>🎥 录像</h2>
            <button class="button" onclick="recordVideo()">开始录像（最长60秒）</button>
            <div id="video-result" class="result"></div>
        </div>

        <!-- 网络请求 -->
        <div class="card">
            <h2>🌐 网络请求</h2>
            <button class="button" onclick="testNetwork()">打开网络测试页面</button>
            <div id="network-result" class="result"></div>
        </div>
    </div>

    <script>
        // 等待AndroidWebBox初始化
        function waitForAndroidWebBox(callback) {
            if (window.AndroidWebBox) {
                callback();
            } else {
                setTimeout(() => waitForAndroidWebBox(callback), 100);
            }
        }

        // 显示结果
        function showResult(elementId, data, isError = false) {
            const resultElement = document.getElementById(elementId);
            resultElement.innerHTML = `<pre class="${isError ? 'error' : 'success'}">${JSON.stringify(data, null, 2)}</pre>`;
            resultElement.classList.add('show');
        }

        // 获取设备信息
        function getDeviceInfo() {
            if (!window.AndroidWebBox) {
                alert('AndroidWebBox未初始化');
                return;
            }

            AndroidWebBox.device.getInfo(function(response) {
                if (response.success) {
                    showResult('device-result', response.data);
                } else {
                    showResult('device-result', response.error, true);
                }
            });
        }

        // 拍照
        function capturePhoto() {
            if (!window.AndroidWebBox) {
                alert('AndroidWebBox未初始化');
                return;
            }

            AndroidWebBox.camera.capture({
                quality: 80
            }, function(response) {
                if (response.success) {
                    showResult('camera-result', response.data);
                } else if (response.error) {
                    showResult('camera-result', response.error, true);
                }
            });
        }

        // 选择单张图片
        function pickSingleImage() {
            if (!window.AndroidWebBox) {
                alert('AndroidWebBox未初始化');
                return;
            }

            AndroidWebBox.gallery.pick({
                multiple: false,
                max_count: 1,
                media_type: 'image'
            }, function(response) {
                if (response.success) {
                    showResult('gallery-result', response.data);
                } else if (response.error) {
                    showResult('gallery-result', response.error, true);
                }
            });
        }

        // 选择多张图片
        function pickMultipleImages() {
            if (!window.AndroidWebBox) {
                alert('AndroidWebBox未初始化');
                return;
            }

            AndroidWebBox.gallery.pick({
                multiple: true,
                max_count: 5,
                media_type: 'image'
            }, function(response) {
                if (response.success) {
                    showResult('gallery-result', response.data);
                } else if (response.error) {
                    showResult('gallery-result', response.error, true);
                }
            });
        }

        // 选择视频
        function pickVideo() {
            if (!window.AndroidWebBox) {
                alert('AndroidWebBox未初始化');
                return;
            }

            AndroidWebBox.gallery.pick({
                multiple: false,
                max_count: 1,
                media_type: 'video'
            }, function(response) {
                if (response.success) {
                    showResult('gallery-result', response.data);
                } else if (response.error) {
                    showResult('gallery-result', response.error, true);
                }
            });
        }

        // 录像
        function recordVideo() {
            if (!window.AndroidWebBox) {
                alert('AndroidWebBox未初始化');
                return;
            }

            AndroidWebBox.video.record({
                max_duration: 60,
                quality: 1
            }, function(response) {
                if (response.success) {
                    showResult('video-result', response.data);
                } else if (response.error) {
                    showResult('video-result', response.error, true);
                }
            });
        }

        // 网络测试
        function testNetwork() {
            window.location.href = 'file:///android_asset/network-test.html';
        }

        // 页面加载完成后检查SDK
        window.addEventListener('load', function() {
            waitForAndroidWebBox(function() {
                console.log('AndroidWebBox SDK ready!');
            });
        });
    </script>
</body>
</html>
