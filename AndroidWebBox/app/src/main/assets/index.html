<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coconut SDK 测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 20px;
        }

        .test-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .test-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .test-section h2::before {
            content: "📱";
            margin-right: 8px;
            font-size: 20px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .result.error {
            background: #fff5f5;
            border-color: #fed7d7;
            color: #c53030;
        }

        .result.success {
            background: #f0fff4;
            border-color: #c6f6d5;
            color: #276749;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
        }

        .status.ready {
            background: #c6f6d5;
            color: #276749;
            display: block;
        }

        .status.error {
            background: #fed7d7;
            color: #c53030;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥥 Coconut SDK</h1>
            <p>DeviceComponent 测试页面</p>
        </div>

        <div class="content">
            <div id="status" class="status"></div>

            <div class="test-section">
                <h2>设备信息</h2>
                <div class="button-group">
                    <button onclick="testGetDeviceInfo()">获取设备信息</button>
                    <button onclick="testGetSystemInfo()">获取系统信息</button>
                    <button onclick="testGetAllInfo()">获取完整信息</button>
                </div>
                <div id="device-result" class="result"></div>
            </div>
        </div>
    </div>

    <script>
        // 显示状态
        function showStatus(message, isError = false) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + (isError ? 'error' : 'ready');
        }

        // 显示结果
        function showResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(data, null, 2);
            element.className = 'result show ' + (isError ? 'error' : 'success');
        }

        // 调用Coconut SDK
        function callCoconut(method, params, callback) {
            const request = {
                method: method,
                params: params || {},
                id: Date.now().toString()
            };

            // 附加 Android 注入的 bridgeToken
            if (window.__coconutConfig && window.__coconutConfig.token) {
                request.bridgeToken = window.__coconutConfig.token;
            }

            console.log('Calling:', method);

            // 调用Android桥接
            if (window.CoconutBridge) {
                const responseJson = CoconutBridge.call(JSON.stringify(request));
                try {
                    const response = JSON.parse(responseJson);
                    if (response.code !== '000000') {
                        callback(response, true);
                    } else {
                        callback(response, false);
                    }
                } catch (e) {
                    callback({ id: request.id, code: '100001', message: 'Parse error: ' + e.message, result: null }, true);
                }
            } else {
                callback({ id: request.id, code: '100005', message: 'CoconutBridge not found', result: null }, true);
            }
        }

        // 测试获取设备信息
        function testGetDeviceInfo() {
            callCoconut('device.getInfo', {}, function(response, isError) {
                if (isError) {
                    showResult('device-result', response, true);
                } else {
                    showResult('device-result', response.result);
                }
            });
        }

        // 测试获取系统信息
        function testGetSystemInfo() {
            callCoconut('device.getSystemInfo', {}, function(response, isError) {
                if (isError) {
                    showResult('device-result', response, true);
                } else {
                    showResult('device-result', response.result);
                }
            });
        }

        // 测试获取所有信息
        function testGetAllInfo() {
            callCoconut('device.getAll', {}, function(response, isError) {
                if (isError) {
                    showResult('device-result', response, true);
                } else {
                    showResult('device-result', response.result);
                }
            });
        }

        // 页面加载完成后检查桥接状态
        window.addEventListener('load', function() {
            if (window.CoconutBridge) {
                showStatus('✅ Coconut SDK 已就绪');
            } else {
                showStatus('❌ Coconut SDK 未初始化', true);
            }
        });
    </script>
</body>
</html>
