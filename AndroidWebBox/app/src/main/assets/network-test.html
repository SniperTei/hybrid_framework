<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>网络请求测试 - AndroidWebBox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .input-group textarea {
            min-height: 80px;
            font-family: monospace;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .button:active {
            transform: scale(0.98);
        }

        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .result.show {
            display: block;
        }

        .success {
            color: #4caf50;
        }

        .error {
            color: #f44336;
        }

        .info {
            color: #2196F3;
        }

        .loading {
            color: #666;
            text-align: center;
            padding: 20px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 5px;
        }

        .badge.get { background: #4CAF50; color: white; }
        .badge.post { background: #2196F3; color: white; }
        .badge.put { background: #FF9800; color: white; }
        .badge.delete { background: #F44336; color: white; }

        .status-code {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-2xx { background: #4CAF50; color: white; }
        .status-4xx { background: #FF9800; color: white; }
        .status-5xx { background: #F44336; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 网络请求测试</h1>

        <!-- 基础请求 -->
        <div class="card">
            <h2>📡 基础请求 <span class="badge get">GET</span></h2>
            <div class="input-group">
                <label>URL</label>
                <input type="text" id="get-url" value="https://jsonplaceholder.typicode.com/posts/1">
            </div>
            <button class="button" onclick="sendGetRequest()">发送 GET 请求</button>
            <div id="get-result" class="result"></div>
        </div>

        <!-- POST请求 -->
        <div class="card">
            <h2>📮 POST 请求 <span class="badge post">POST</span></h2>
            <div class="input-group">
                <label>URL</label>
                <input type="text" id="post-url" value="https://jsonplaceholder.typicode.com/posts">
            </div>
            <div class="input-group">
                <label>请求体 (JSON)</label>
                <textarea id="post-body">{
  "title": "测试标题",
  "body": "测试内容",
  "userId": 1
}</textarea>
            </div>
            <button class="button" onclick="sendPostRequest()">发送 POST 请求</button>
            <div id="post-result" class="result"></div>
        </div>

        <!-- PUT请求 -->
        <div class="card">
            <h2>✏️ PUT 请求 <span class="badge put">PUT</span></h2>
            <div class="input-group">
                <label>URL</label>
                <input type="text" id="put-url" value="https://jsonplaceholder.typicode.com/posts/1">
            </div>
            <div class="input-group">
                <label>请求体 (JSON)</label>
                <textarea id="put-body">{
  "id": 1,
  "title": "更新后的标题",
  "body": "更新后的内容",
  "userId": 1
}</textarea>
            </div>
            <button class="button" onclick="sendPutRequest()">发送 PUT 请求</button>
            <div id="put-result" class="result"></div>
        </div>

        <!-- DELETE请求 -->
        <div class="card">
            <h2>🗑️ DELETE 请求 <span class="badge delete">DELETE</span></h2>
            <div class="input-group">
                <label>URL</label>
                <input type="text" id="delete-url" value="https://jsonplaceholder.typicode.com/posts/1">
            </div>
            <button class="button" onclick="sendDeleteRequest()">发送 DELETE 请求</button>
            <div id="delete-result" class="result"></div>
        </div>

        <!-- 请求头测试 -->
        <div class="card">
            <h2>📋 自定义请求头</h2>
            <div class="input-group">
                <label>URL</label>
                <input type="text" id="header-url" value="https://jsonplaceholder.typicode.com/posts">
            </div>
            <div class="input-group">
                <label>自定义请求头 (JSON)</label>
                <textarea id="header-headers">{
  "X-Custom-Header": "test-value",
  "X-Request-ID": "12345"
}</textarea>
            </div>
            <button class="button" onclick="sendWithHeaders()">发送带请求头的请求</button>
            <div id="header-result" class="result"></div>
        </div>

        <!-- 配置测试 -->
        <div class="card">
            <h2>⚙️ 网络配置</h2>
            <div class="input-group">
                <label>Base URL</label>
                <input type="text" id="config-base-url" placeholder="https://api.example.com">
            </div>
            <div class="input-group">
                <label>超时时间 (毫秒)</label>
                <input type="number" id="config-timeout" value="30000">
            </div>
            <button class="button" onclick="setNetworkConfig()">设置网络配置</button>
            <div id="config-result" class="result"></div>
        </div>
    </div>

    <script>
        // 等待AndroidWebBox初始化
        function waitForAndroidWebBox(callback) {
            if (window.AndroidWebBox) {
                callback();
            } else {
                setTimeout(() => waitForAndroidWebBox(callback), 100);
            }
        }

        // 显示结果
        function showResult(elementId, data, isError = false) {
            const resultElement = document.getElementById(elementId);
            let html = '<pre>';

            if (data.statusCode) {
                const statusClass = data.statusCode >= 200 && data.statusCode < 300 ? 'status-2xx' :
                                   data.statusCode >= 400 && data.statusCode < 500 ? 'status-4xx' : 'status-5xx';
                html += `<div style="margin-bottom: 10px;">`;
                html += `<span class="status-code ${statusClass}">HTTP ${data.statusCode}</span>`;
                html += `</div>`;
            }

            if (data.data) {
                try {
                    const jsonData = JSON.parse(data.data);
                    html += `<div class="${isError ? 'error' : 'success'}">`;
                    html += `<strong>Response Data:</strong>\n`;
                    html += JSON.stringify(jsonData, null, 2);
                    html += `</div>`;
                } catch (e) {
                    html += `<div class="${isError ? 'error' : 'success'}">`;
                    html += `<strong>Response Data:</strong>\n`;
                    html += data.data;
                    html += `</div>`;
                }
            }

            if (data.headers) {
                html += `\n<div class="info"><strong>Response Headers:</strong></div>\n`;
                html += JSON.stringify(data.headers, null, 2);
            }

            if (data.error) {
                html += `\n<div class="error"><strong>Error:</strong> ${data.error.message || data.error.code}</div>`;
            }

            html += '</pre>';
            resultElement.innerHTML = html;
            resultElement.classList.add('show');
        }

        // GET请求
        function sendGetRequest() {
            const url = document.getElementById('get-url').value;
            if (!url) {
                alert('请输入URL');
                return;
            }

            AndroidWebBox.http.get({
                url: url
            }, function(response) {
                if (response.success || response.statusCode) {
                    showResult('get-result', response);
                } else {
                    showResult('get-result', response.error, true);
                }
            });
        }

        // POST请求
        function sendPostRequest() {
            const url = document.getElementById('post-url').value;
            const body = document.getElementById('post-body').value;

            if (!url) {
                alert('请输入URL');
                return;
            }

            try {
                const bodyData = JSON.parse(body);
                AndroidWebBox.http.post({
                    url: url,
                    data: bodyData
                }, function(response) {
                    if (response.success || response.statusCode) {
                        showResult('post-result', response);
                    } else {
                        showResult('post-result', response.error, true);
                    }
                });
            } catch (e) {
                alert('JSON格式错误: ' + e.message);
            }
        }

        // PUT请求
        function sendPutRequest() {
            const url = document.getElementById('put-url').value;
            const body = document.getElementById('put-body').value;

            if (!url) {
                alert('请输入URL');
                return;
            }

            try {
                const bodyData = JSON.parse(body);
                AndroidWebBox.http.put({
                    url: url,
                    data: bodyData
                }, function(response) {
                    if (response.success || response.statusCode) {
                        showResult('put-result', response);
                    } else {
                        showResult('put-result', response.error, true);
                    }
                });
            } catch (e) {
                alert('JSON格式错误: ' + e.message);
            }
        }

        // DELETE请求
        function sendDeleteRequest() {
            const url = document.getElementById('delete-url').value;
            if (!url) {
                alert('请输入URL');
                return;
            }

            AndroidWebBox.http.delete({
                url: url
            }, function(response) {
                if (response.success || response.statusCode) {
                    showResult('delete-result', response);
                } else {
                    showResult('delete-result', response.error, true);
                }
            });
        }

        // 发送带请求头的请求
        function sendWithHeaders() {
            const url = document.getElementById('header-url').value;
            const headersStr = document.getElementById('header-headers').value;

            if (!url) {
                alert('请输入URL');
                return;
            }

            try {
                const headers = JSON.parse(headersStr);
                AndroidWebBox.http.get({
                    url: url,
                    headers: headers
                }, function(response) {
                    if (response.success || response.statusCode) {
                        showResult('header-result', response);
                    } else {
                        showResult('header-result', response.error, true);
                    }
                });
            } catch (e) {
                alert('JSON格式错误: ' + e.message);
            }
        }

        // 设置网络配置
        function setNetworkConfig() {
            const baseUrl = document.getElementById('config-base-url').value;
            const timeout = parseInt(document.getElementById('config-timeout').value);

            AndroidWebBox.http.setConfig({
                baseUrl: baseUrl,
                connectTimeout: timeout,
                readTimeout: timeout,
                enableCache: true,
                retryCount: 2
            }, function(response) {
                if (response.success) {
                    showResult('config-result', { data: '网络配置已更新' });
                } else {
                    showResult('config-result', response.error, true);
                }
            });
        }

        // 页面加载完成后检查SDK
        window.addEventListener('load', function() {
            waitForAndroidWebBox(function() {
                console.log('AndroidWebBox SDK ready for network requests!');
            });
        });
    </script>
</body>
</html>
